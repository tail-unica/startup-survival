# The unit and integration tests, on every push and pull request.
#
# Nothing here needs the PitchBook extraction: every test builds the few rows it
# needs, and the integration test reads the notebooks' source rather than their
# output. That is why the workflow can run on a clean runner.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # uv.lock pins the exact resolution the results were produced with.
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the project
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q
