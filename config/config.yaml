# --- Best found hyperparameters  ---
sweep_settings:
  method: grid
  metric:
    name: F1_val
    goal: maximize
  parameters:
    model_type:
      values: ["rf","lgb","mlp","dt","lr","svm","tabpfn"]
    # The seeds this sweep runs on. Crossed with model_type by the grid:
    # 7 models x 5 seeds = 35 runs. Each run draws one, and it drives both the
    # split and the model's randomness, so the five runs of a model are five
    # independent replications; results are reported as mean +- std across
    # them, which is what tells a real gap between two models from split noise.
    seed:
      values: [1, 2, 3, 4, 5]
    # RF
    rf_n_estimators:
      values: [200]
    rf_max_depth:
      values: [15]
    rf_min_samples_leaf:
      values: [9]
    # LGB
    lgb_n_estimators:
      values: [300]
    lgb_max_depth:
      values: [5]
    learning_rate:
      values: [0.03092792034710772]
    min_child_weight:
      values: [20]
    subsample:
      values: [0.4]
    colsample_bytree:
      values: [1]
    reg_alpha:
      values: [7.471515240794344]
    reg_lambda:
      values: [3.0246578811237925]
    # DT
    dt_max_depth:
      values: [5]
    dt_min_samples_leaf:
      values: [2]
    dt_min_samples_split:
      values: [9]
    dt_criterion:
      values: ["entropy"]
    # LR
    lr_C:
      values: [0.29719610165875604]
    lr_penalty:
      values: ["l2"]
    # MLP
    hidden_sizes:
      values: ["512,256,128"]
    mlp_learning_rate:
      values: [0.006481694307849973]
    dropout_rate:
      values: [0.3]
    weight_decay:
      values: [0.00012295217130781902]
    batch_size:
      values: [256]
    # SVM — placeholder defaults, not yet tuned: re-run the bayes sweep above
    # to replace them with the best found configuration.
    svm_C:
      values: [0.7]
    svm_gamma:
      values: ["scale"]
    # TabPFN — 8 is the client default ensemble size.
    tabpfn_n_estimators:
      values: [8]