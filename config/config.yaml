
paths:
  raw_dataset: "data/raw/panel.csv.gz"
  raw_university_ranking: "data/raw/QS_World_Rankings.csv"
  dataset_window: "data/processed/dataset_window.csv"
  dataset_nowindow: "data/processed/dataset_nowindow.csv"

time_window: 7
last_year: 2024
test_size: 0.4
seeds: [1, 2, 3, 4, 5, 12] #seeds for data split, include all possible splits. 12 is used only for the bayes sweep, not for the final evaluation
shap_seed: 1 #SHAP is performed on the first seed only. The other seeds are used for the final evaluation of the models.

# Frequency encoding of the categorical features. Fitted on each seed's TRAINING split only 
#
# min_frequency is a share of the training rows, not a raw count. 
# A category below it is pooled into `other_label`, and so are the
# categories a held-out split shows for the first time and the missing values.

frequency_encoding:
  columns: ["HQCountry", "PrimaryIndustrySector"]
  min_frequency: 0.05
  other_label: "Others"

# Budget for shap.PermutationExplainer, used by SVM and TabPFN (the models that
# admit neither TreeExplainer nor LinearExplainer). It costs
# n_explain * (2*n_features+1) * n_background rows of prediction, which is a
# different currency for the two models, hence one budget each:
#
#  - svm    pays CPU time locally. 100 x 91 x 20 = 182k rows against ~12k
#           support vectors takes about 8 minutes.
#  - tabpfn pays Prior Labs API credits, billed roughly
#           rows * n_features * n_estimators, against a 50M/day cap. One pass
#           over the three splits already costs ~11M, so the SHAP budget has to
#           leave room for the four experiments (window, nowindow, noteam,
#           nocompetitors): 30 x 91 x 8 = 21.8k rows ~ 7.9M credits per run.
shap_permutation:
  svm:
    n_explain: 100
    n_background: 20
  tabpfn:
    n_explain: 30
    n_background: 8


