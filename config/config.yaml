
paths:
  # I due panel che build_panel.ipynb produce, uno per configurazione degli
  # interruttori: attributi dell'anno il primo, fotografia all'estrazione il
  # secondo. Il dataset con la finestra nasce dal primo, quello senza dal secondo.
  panel_timed: "data/interim/panel.csv.gz"
  panel_snapshot: "data/interim/panel_snapshot.csv.gz"
  raw_university_ranking: "data/raw/QS_World_Rankings.csv"
  dataset_window: "data/processed/dataset_window.csv"
  dataset_nowindow: "data/processed/dataset_nowindow.csv"

time_window: 7

# Missing-value policy of the processed datasets.
#
# A feature missing on more than `missing_threshold` of the rows is dropped: past
# that point the imputation would be inventing the column rather than completing
# it. The budget goes with it: with the threshold at 0.5 the four sparsest
# features stay in, so a row missing exactly those is normal rather than
# pathological, and a budget of 4 would drop a fifth of the firms to keep them.
preprocessing:
  missing_threshold: 0.5
  max_missing_per_row: 6

first_year: 2000
last_year: 2024
test_size: 0.4
seeds: [1, 2, 3, 4, 5, 12] #seeds for data split, include all possible splits. 12 is used only for the bayes sweep, not for the final evaluation
shap_seed: 1 #SHAP is performed on the first seed only. The other seeds are used for the final evaluation of the models.

# Frequency encoding of the categorical features. Fitted on each seed's TRAINING split only 
#
# min_frequency is a share of the training rows, not a raw count. 
# A category below it is pooled into `other_label`, and so are the
# categories a held-out split shows for the first time and the missing values.

frequency_encoding:
  columns: ["HQCountry", "PrimaryIndustrySector"]
  min_frequency: 0.05
  other_label: "Others"

# Budget for shap.PermutationExplainer, used by SVM and TabPFN (the models that
# admit neither TreeExplainer nor LinearExplainer). It costs
# n_explain * (2*n_features+1) * n_background rows of prediction, which is a
# different currency for the two models, hence one budget each:
#
#  - svm    pays CPU time locally. 100 x 91 x 20 = 182k rows against ~12k
#           support vectors takes about 8 minutes.
#  - tabpfn pays one forward pass per row, on the GPU, over an ~18k-row
#           training context. These numbers were sized for the metered API the
#           model used to run on; running locally the ceiling is GPU time, so
#           they can be raised towards the SVM's once a run has been timed.
shap_permutation:
  svm:
    n_explain: 100
    n_background: 20
  tabpfn:
    n_explain: 30
    n_background: 8

# The two ablation settings, as the columns they remove from dataset_window.
# What counts as a team feature and what counts as a competition feature is a
# claim the paper makes, so it is written here rather than inside a notebook
# cell.
ablations:
  noteam:
    - Total_People
    - WorkExp_Idx_Mean
    - Highest_Degree_Mean
    - Total_Founders
    - Percent_Females
    - Avg_Earliest_Year
    - HasTop50Institute
    - Is_Eco
    - Is_Eng
    - Is_NS
    - Is_Hum
    - Is_SS
    - Is_Med
    - Is_Law
    - Is_IT
    - WorkExperienceIndex_CEO
    - Highest_Degree_CEO
    - Gender_CEO_Female
  nocompetitors:
    - SimilarityScoreMean
    - N_Competitors
    - Same_Country


