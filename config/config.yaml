# --- Best found hyperparameters  ---
sweep_settings:
  method: grid
  metric:
    name: F1_val
    goal: maximize
  parameters:
    model_type:
      values: ["rf","lgb","mlp","dt","lr","svm","tabpfn"]
    # The seeds this sweep runs on, from `seeds` above. Crossed with model_type by
    # the grid: 7 models x 5 seeds = 35 runs.
    seed:
      values: *seeds
    # RF
    rf_n_estimators:
      values: [200]
    rf_max_depth:
      values: [15]
    rf_min_samples_leaf:
      values: [9]
    # LGB
    lgb_n_estimators:
      values: [300]
    lgb_max_depth:
      values: [5]
    learning_rate:
      values: [0.03092792034710772]
    min_child_weight:
      values: [20]
    subsample:
      values: [0.4]
    colsample_bytree:
      values: [1]
    reg_alpha:
      values: [7.471515240794344]
    reg_lambda:
      values: [3.0246578811237925]
    # DT
    dt_max_depth:
      values: [5]
    dt_min_samples_leaf:
      values: [2]
    dt_min_samples_split:
      values: [9]
    dt_criterion:
      values: ["entropy"]
    # LR
    lr_C:
      values: [0.29719610165875604]
    lr_penalty:
      values: ["l2"]
    # MLP
    hidden_sizes:
      values: ["512,256,128"]
    mlp_learning_rate:
      values: [0.006481694307849973]
    dropout_rate:
      values: [0.3]
    weight_decay:
      values: [0.00012295217130781902]
    batch_size:
      values: [256]
    svm_C:
      values: [0.7]
    svm_gamma:
      values: ["scale"]
    tabpfn_n_estimators:
      values: [8]

# The two ablation settings, as the columns they remove from dataset_controlled.
ablations:
  noteam:
    - Total_People
    - WorkExp_Idx_Mean
    - Highest_Degree_Mean
    - Total_Founders
    - Percent_Females
    - Avg_Earliest_Year
    - HasTop50Institute
    - Is_Eco
    - Is_Eng
    - Is_NS
    - Is_Hum
    - Is_SS
    - Is_Med
    - Is_Law
    - Is_IT
    - WorkExperienceIndex_CEO
    - Highest_Degree_CEO
    - Gender_CEO_Female
  nocompetitors:
    - SimilarityScoreMean
    - N_Competitors
    - N_Similar
    - Same_Country
test_size: 0.4


frequency_encoding:
  columns: ["HQCountry", "PrimaryIndustrySector"] # Categorical columns to be frequency encoded. The other categorical column, Gender_CEO, becomes a single indicator in preprocessing.
  min_frequency: 0.05 # Minimum frequency threshold for frequency encoding (is a share of the training rows, not a raw count)
  other_label: "Others" # Label for categories below the minimum frequency threshold
shap_seed: 1 #SHAP is performed on the first seed only. The other seeds are used for the final evaluation of the models.

# Budget for shap.PermutationExplainer, used by SVM and TabPFN (the models that
# admit neither TreeExplainer nor LinearExplainer).
shap_permutation:
  svm:
    n_explain: 100
    n_background: 20
  tabpfn:
    n_explain: 30
    n_background: 8


figures:
  dir: "img/shap" #path to save the SHAP figures
  shap_comparison: # define the model and experiments to compare in the SHAP comparison plot
    model: "lgb"
    experiments: ["controlled", "leakboth"]
