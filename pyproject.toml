[project]
name = "startup-survival"
version = "0.1.0"
description = "Look-ahead bias-free evaluation framework for startup success prediction"
readme = "README.md"
requires-python = ">=3.12"

# Derived from the imports actually present in src/, scripts/ and the notebook.
# Floors are the versions the published results were produced with; uv.lock
# pins the exact resolution.
dependencies = [
    "polars>=1.38.1",
    "pandas>=2.3.3",
    "numpy>=2.3.5",
    "scikit-learn>=1.7.2",
    "lightgbm>=4.6.0",
    "torch>=2.10.0",
    "tabpfn>=8.0.8",
    "shap>=0.50.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "scipy>=1.17.0",
    "statsmodels>=0.14.6",
    "wandb>=0.24.0",
    "PyYAML>=6.0.3",
    "python-dotenv>=1.2.2",
    "joblib>=1.5.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.16",
    "ipykernel>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
# The original R scripts live under src/ for reference while the pipeline is
# ported to Python; they are not part of the package.
exclude = ["src/RCode"]

[tool.ruff]
line-length = 100

# ruff formats Python blocks inside Markdown, and the spec and plan documents
# quote code as it was written.
extend-exclude = ["docs/"]

[tool.ruff.lint]
# E   pycodestyle errors      N   PEP 8 naming
# F   pyflakes                UP  pyupgrade
# I   import sorting          B   flake8-bugbear
select = ["E", "F", "I", "N", "UP", "B"]

# X for the design matrix and y for the target is the scikit-learn convention
# this code follows throughout; lowercasing X_train would diverge from the API
# it calls. Only function names are held to PEP 8 (N802).
ignore = ["N803", "N806", "N816"]
